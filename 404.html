<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Sans Dental Studio</title>
  <meta name="description" content="The page you are looking for could not be found. Return to Sans Dental Studio homepage." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=6" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32x32.png?v=6" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16x16.png?v=6" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png?v=6" />
  <link rel="manifest" href="./site.webmanifest" />
  <meta name="theme-color" content="#0F766E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #0F766E;
      --teal-dark: #0a5c56;
      --white: #ffffff;
      --font: 'Inter', sans-serif;
      --font-logo: 'Poppins', sans-serif;
    }
    body {
      font-family: var(--font);
      background: #f8fffe;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .error-container { max-width: 560px; }
    .error-icon {
      font-size: 96px;
      line-height: 1;
      margin-bottom: 24px;
      filter: grayscale(0.2);
    }
    .error-code {
      font-family: var(--font-logo);
      font-size: clamp(72px, 15vw, 120px);
      font-weight: 700;
      color: var(--teal);
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -4px;
    }
    .error-title {
      font-family: var(--font-logo);
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 700;
      color: #111;
      margin-bottom: 16px;
    }
    .error-desc {
      font-size: 16px;
      line-height: 1.7;
      color: #555;
      margin-bottom: 36px;
    }
    .error-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      display: inline-block;
      background: var(--teal);
      color: #fff;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
      letter-spacing: 0.02em;
    }
    .btn-primary:hover { background: var(--teal-dark); transform: translateY(-2px); }
    .btn-secondary {
      display: inline-block;
      border: 2px solid var(--teal);
      color: var(--teal);
      font-family: var(--font);
      font-size: 15px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      letter-spacing: 0.02em;
    }
    .btn-secondary:hover { background: var(--teal); color: #fff; transform: translateY(-2px); }
    .error-nav {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid #e0f0ee;
    }
    .error-nav p { font-size: 13px; color: #888; margin-bottom: 14px; }
    .error-nav-links {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-nav-links a {
      font-size: 14px;
      color: var(--teal);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .error-nav-links a:hover { opacity: 0.75; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-icon">🦷</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      We couldn't find the page you're looking for.<br />
      It may have been moved, renamed, or removed.
    </p>
    <div class="error-actions">
      <a href="./index.html" class="btn-primary">Return to Home</a>
      <a href="./pages/contact.html" class="btn-secondary">Contact Us</a>
    </div>
    <div class="error-nav">
      <p>Or visit one of our pages:</p>
      <div class="error-nav-links">
        <a href="./pages/about.html">About</a>
        <a href="./pages/service.html">Services</a>
        <a href="./pages/gallery.html">Gallery</a>
        <a href="./pages/contact.html">Contact</a>
      </div>
    </div>
  </div>
</body>
</html>
